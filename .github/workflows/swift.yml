name: "Build & Test MVVMCollection"

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 2 * * *' # run at 2 AM UTC

jobs:
  build-and-test:
    name: "Build & Test MVVMCollection"
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - name: Run UIKit tests
        shell: bash
        run: |
          device_id="$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')"
          test -n "$device_id"
          xcodebuild test \
            -workspace .swiftpm/xcode/package.xcworkspace \
            -scheme MVVMCollection \
            -destination "platform=iOS Simulator,id=$device_id" \
            CODE_SIGNING_ALLOWED=NO
